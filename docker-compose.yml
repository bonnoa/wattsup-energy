# Développement local : `docker compose up -d db`.
# Le service app est ajouté en T11.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wattsup
      POSTGRES_PASSWORD: wattsup
      POSTGRES_DB: wattsup
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattsup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
