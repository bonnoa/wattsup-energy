<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E6E2D8;font-family:'Instrument Sans',system-ui,sans-serif;color:#16181A}a{color:#3D5A80}a:hover{color:#16181A}</style>
</helmet>
<section style="padding:48px 56px 64px;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px;max-width:760px">
    <div style="font-size:22px;font-weight:600;letter-spacing:-0.01em">WattsUp Energy · prototype responsive</div>
    <div style="font-size:14px;line-height:1.5;color:#5E625C">Même application, deux mises en page. Les deux instances sont interactives et indépendantes : désactivez le bois ou la batterie dans Réglages pour voir l'interface s'adapter.</div>
  </div>
  <div style="display:flex;gap:48px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font:600 11px 'JetBrains Mono',monospace;color:#5E625C">DESKTOP · 1280</div>
      <div style="width:1280px;height:820px;border-radius:14px;overflow:hidden;border:1px solid #CFC9BB;box-shadow:0 20px 50px rgba(22,24,26,0.12);background:#F4F2EC">
        <dc-import name="WattsUpApp" layout="desktop" style="width:100%;height:100%" hint-size="1280px,820px"></dc-import>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font:600 11px 'JetBrains Mono',monospace;color:#5E625C">MOBILE · 390</div>
      <div style="width:390px;height:844px;border-radius:48px;overflow:hidden;border:10px solid #16181A;box-shadow:0 20px 50px rgba(22,24,26,0.18);background:#F4F2EC;position:relative">
        <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:16px;background:#16181A;z-index:2"></div>
        <dc-import name="WattsUpApp" layout="mobile" style="width:100%;height:100%" hint-size="370px,824px"></dc-import>
      </div>
    </div>
  </div>
</section>
</x-dc>
</body>
</html>
